image:
  repository: ghcr.io/egressfox-io/egressfox
  # Empty uses Chart.appVersion so release packaging has one version authority.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

state:
  size: 1Gi
  storageClassName: ""

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "2", memory: 1Gi}

metrics:
  service: true
