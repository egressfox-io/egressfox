{{- $name := include "egressfox.name" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-manager
rules:
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["egressfox.io"]
    resources: ["proxypools", "egressgateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["egressfox.io"]
    resources: ["proxypools/status", "egressgateways/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}-manager, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-manager}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $name }}-leader-election, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}-leader-election, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-leader-election}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ $name }}-metrics-auth}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ $name }}-metrics-reader}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-state
  namespace: {{ .Release.Namespace }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.state.storageClassName }}
  storageClassName: {{ .Values.state.storageClassName | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.state.size }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: {{ include "egressfox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--leader-elect=true", "--state-path=/var/lib/egressfox/private/state.db", "--metrics-bind-address=:8443", "--health-probe-bind-address=:8081"]
          env:
            - name: WATCH_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: EGRESSFOX_MANAGED_RUNTIME_IMAGE
              value: {{ include "egressfox.image" . | quote }}
          ports: [{name: metrics, containerPort: 8443}, {name: health, containerPort: 8081}]
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: state, mountPath: /var/lib/egressfox}, {name: temporary, mountPath: /tmp}]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: {{ $name }}-state}
        - name: temporary
          emptyDir: {sizeLimit: 512Mi}
{{- if .Values.metrics.service }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}-metrics, namespace: {{ .Release.Namespace }}}
spec:
  selector: {app.kubernetes.io/name: egressfox, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: https, port: 8443, targetPort: metrics}]
{{- end }}
