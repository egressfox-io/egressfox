apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egressfox-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egressfox-controller-manager
  labels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/component: operator}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/component: operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: egressfox, app.kubernetes.io/component: operator}
    spec:
      serviceAccountName: egressfox-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
            - --state-path=/var/lib/egressfox/private/state.db
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            - {name: metrics, containerPort: 8443}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /var/lib/egressfox}
            - {name: temporary, mountPath: /tmp}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: egressfox-state}
        - name: temporary
          emptyDir: {sizeLimit: 512Mi}
