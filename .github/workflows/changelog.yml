name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Changelog validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test read-only release-note generation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s hack -p 'test_release_*.py'
      - name: Preview current Git history without modifying source
        run: PYTHONDONTWRITEBYTECODE=1 python3 hack/generate-changelog.py --preview >/dev/null
