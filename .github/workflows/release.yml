name: Release validation and publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing SemVer tag (vX.Y.Z, or -dev.N, -alpha.N, -beta.N)
        required: true
        type: string
      publish:
        description: Publish only after protected-environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Non-publishing release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container
      - name: Verify selected ref and version
        run: |
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "$VERSION"
          fi
      - run: make check
      - run: make k8s-compat
      - run: make vuln
      - run: make release-dry-run

  publish:
    name: Publish signed release
    if: ${{ inputs.publish == true }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/egressfox-io/egressfox
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container
      - name: Recheck trusted tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$VERSION"
          test -z "$(git status --porcelain)"
      - name: Construct release files without registry writes
        env:
          RELEASE_SKIP_IMAGE: "1"
        run: make release-dry-run
      - name: Check remote release identity and reviewed notes
        run: |
          python3 hack/release-notes.py --version "$VERSION" --output dist/release-notes.md
          python3 hack/release-preflight.py
      - name: Authenticate to GHCR
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned multi-platform image
        id: image
        run: |
          python3 hack/release-preflight.py
          normalized=${VERSION#v}
          revision=$(git rev-parse HEAD)
          created=$(git show -s --format=%cI HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --tag "$IMAGE:$normalized" \
            --build-arg "VERSION=$normalized" --build-arg "REVISION=$revision" \
            --build-arg "CREATED=$created" --build-arg "SOURCE_DATE_EPOCH=$epoch" \
            --metadata-file dist/image-metadata.json .
          digest=$(jq -r '."containerimage.digest"' dist/image-metadata.json)
          test "${digest#sha256:}" != "$digest"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Generate and scan final image SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          normalized=${VERSION#v}
          syft=$(find .cache/release-tools -type f -name 'syft-*' | head -1)
          grype=$(find .cache/release-tools -type f -name 'grype-*' | head -1)
          "$syft" scan "registry:$IMAGE@$DIGEST" -o "spdx-json=dist/release/egressfox-image-$normalized.spdx.json"
          "$grype" "$IMAGE@$DIGEST" --fail-on high --output json --file "dist/reports/egressfox-image-$normalized.grype.json"
          cd dist/release
          find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | xargs sha256sum >SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Keylessly sign image and attach SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          normalized=${VERSION#v}
          cosign=$(find .cache/release-tools -type f -name 'cosign-*' | head -1)
          "$cosign" sign --yes "$IMAGE@$DIGEST"
          "$cosign" attest --yes --type spdxjson \
            --predicate "dist/release/egressfox-image-$normalized.spdx.json" "$IMAGE@$DIGEST"
      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Create release and upload verified files
        run: |
          case "$VERSION" in
            *-dev.*|*-alpha.*|*-beta.*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          # A published version is immutable: never replace, delete or recreate
          # an existing release or its assets. Publish a new version instead.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; published versions are immutable" >&2
            echo "publish a new version such as the next -dev.N snapshot instead" >&2
            exit 1
          fi
          gh release create "$VERSION" --verify-tag --notes-file dist/release-notes.md $prerelease
          gh release upload "$VERSION" dist/release/*
